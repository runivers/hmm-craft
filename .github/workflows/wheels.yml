name: wheels

# 20 wheels and the sdist. A pull request builds and tests the Linux x86_64
# cells only; a manual run, the weekly schedule and a release build everything.
# Every wheel is tested after it is built, from the installed wheel, so a cell
# that cannot run the tests ships no wheel. Build requirements are pinned with
# hashes in ci/build_requirements.txt and installed before each build; nothing
# fetches them at whatever version is current.

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"
  workflow_call:
    inputs:
      full:
        description: Build every platform, not only Linux x86_64.
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: wheels-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
    - id: matrix
      env:
        FULL: ${{ inputs.full || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' }}
      run: |
        cells='{"name":"linux-x86_64","os":"ubuntu-24.04","archs":"x86_64"}'
        if [ "$FULL" = true ]; then
          cells="$cells"',{"name":"linux-aarch64","os":"ubuntu-24.04-arm","archs":"aarch64"}'
          cells="$cells"',{"name":"macos-arm64","os":"macos-14","archs":"arm64"}'
          cells="$cells"',{"name":"macos-x86_64","os":"macos-15-intel","archs":"x86_64"}'
          cells="$cells"',{"name":"windows-amd64","os":"windows-2025","archs":"AMD64"}'
        fi
        echo "matrix={\"include\":[$cells]}" >> "$GITHUB_OUTPUT"

  wheels:
    name: wheels (${{ matrix.name }})
    needs: plan
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false
    - uses: pypa/cibuildwheel@f9b966cfadf4109556cadc5bb39ddb72d0ce664e  # v4.3.5
      env:
        # CPython 3.12 to 3.15 with the GIL; no free-threaded, musllinux or
        # 32-bit builds. Linux wheels are manylinux_2_28 (cibuildwheel's
        # default image).
        CIBW_BUILD: "cp312-* cp313-* cp314-* cp315-*"
        CIBW_SKIP: "*-musllinux_*"
        CIBW_ARCHS: ${{ matrix.archs }}
        CIBW_BUILD_FRONTEND: "pip; args: --no-build-isolation"
        CIBW_BEFORE_BUILD: >-
          python -m pip install --only-binary :all: --require-hashes
          -r {project}/ci/build_requirements.txt
        CIBW_TEST_REQUIRES: pytest
        CIBW_TEST_ENVIRONMENT: HMMCRAFT_SEED=0
        # The project's pytest configuration turns a DeprecationWarning from
        # the package into an error. The installed wheel is tested, not the
        # tree.
        CIBW_TEST_COMMAND: >-
          python -I -m pytest -c {project}/pyproject.toml -p no:cacheprovider
          --pyargs hmmcraft.tests {project}/doc
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
      with:
        name: dist-wheels-${{ matrix.name }}
        path: wheelhouse/*.whl
        if-no-files-found: error

  sdist:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      HMMCRAFT_SEED: "0"
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
      with:
        python-version: "3.12"
    - name: Build the sdist
      run: |
        python -m pip install --only-binary :all: --require-hashes \
          -r ci/tool_requirements.txt
        python -m pip install --only-binary :all: --require-hashes \
          -r ci/build_requirements.txt
        python -m build --sdist --no-isolation
        ls -l dist
        tar tzf dist/*.tar.gz > sdist_files.txt
        for f in ext/_hmmc.cpp pyproject.toml LICENSE.txt AUTHORS.rst; do
          grep -q "/$f\$" sdist_files.txt || { echo "missing $f" >&2; exit 1; }
        done
    - name: Install the sdist and run the suite
      run: |
        python -m venv "$RUNNER_TEMP/sdist-env"
        env_python="$RUNNER_TEMP/sdist-env/bin/python"
        "$env_python" -m pip install --only-binary :all: --require-hashes \
          -r ci/build_requirements.txt
        "$env_python" -m pip install --only-binary :all: \
          numpy scipy scikit-learn pytest
        "$env_python" -m pip install --no-build-isolation --no-deps \
          dist/*.tar.gz
        cd "$RUNNER_TEMP"
        "$env_python" -I -m pytest -p no:cacheprovider --pyargs hmmcraft.tests
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
      with:
        name: dist-sdist
        path: dist/*.tar.gz
        if-no-files-found: error
