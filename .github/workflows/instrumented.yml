name: instrumented

# The suite against instrumented builds of the C++ kernel, never used for a
# release: nothing built here is uploaded or published. Every job installs the
# newest NumPy, SciPy and scikit-learn wheels. The "coverage" job builds the
# kernel with --coverage and no optimisation, runs the suite under
# coverage.py, and fails when the Python total or the kernel's line coverage
# falls below its floor in pyproject.toml; the reports are in the log and in
# the run's "coverage-reports" artifact. On a pull request it also measures
# the lines the pull request adds or changes and their branches, and fails
# when fewer than 90% of those lines run or fewer than 85% of their branches
# are taken, the Python package and the kernel each on its own
# (scripts/check_diff_coverage.py); blank lines, comments and deleted lines do
# not count. The "sanitizers" job builds the kernel with AddressSanitizer and
# UndefinedBehaviorSanitizer and runs the suite; the first error either finds
# stops the run, with its report in the log. The "thread-sanitizer" job
# builds the kernel with ThreadSanitizer, which cannot be combined with
# AddressSanitizer in one build, and runs the tests of the kernel's threads;
# the first data race it finds stops the run, with its report in the log.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "37 4 * * 1"

permissions:
  contents: read

concurrency:
  group: instrumented-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      HMMCRAFT_SEED: "0"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
      with:
        python-version: "3.12"
    - name: Build requirements, coverage tools, newest dependencies
      run: |
        python -m pip install --only-binary :all: --require-hashes \
          -r ci/build_requirements.txt
        python -m pip install --only-binary :all: --require-hashes \
          -r ci/coverage_requirements.txt
        python -m pip install --only-binary :all: \
          numpy scipy scikit-learn threadpoolctl pytest
        python -m pip freeze
        c++ --version
        gcov --version
    - name: Build the kernel with --coverage, unoptimised
      # setuptools puts CXXFLAGS in place of the interpreter's CFLAGS on the
      # C++ compile line, so -DNDEBUG is given here again; -g in CFLAGS keeps
      # pybind11 from adding -g0.
      env:
        CFLAGS: "-O0 -g --coverage"
        CXXFLAGS: "-O0 -g -DNDEBUG --coverage"
        LDFLAGS: "--coverage"
      run: |
        rm -rf build src/hmm_craft.egg-info
        python -m pip install -v --no-build-isolation --no-deps .
        ls build/temp.*/ext/_hmmc.gcno build/temp.*/ext/_emissionsc.gcno
        find build -name '*.gcda' -delete
    - name: Suite under coverage.py
      id: suite
      run: >-
        python -I -m coverage run -m pytest -p no:cacheprovider -q
        --pyargs hmmcraft.tests doc
    - name: Python coverage, floor in pyproject.toml
      if: ${{ !cancelled() && steps.suite.outcome != 'skipped' }}
      run: |
        python -I -m coverage html --fail-under=0 \
          -d "$RUNNER_TEMP/coverage-reports/python"
        python -I -m coverage report
    - name: Kernel coverage (ext/), floor in pyproject.toml
      if: ${{ !cancelled() && steps.suite.outcome != 'skipped' }}
      run: |
        ls build/temp.*/ext/_hmmc.gcda build/temp.*/ext/_emissionsc.gcda
        mkdir -p "$RUNNER_TEMP/coverage-reports/kernel"
        python -I -m gcovr --root . --txt-summary \
          --html-details "$RUNNER_TEMP/coverage-reports/kernel/index.html"
    - name: Lines and branches the pull request adds, limits in the script
      # Pull requests only: a push has no base to measure against. The
      # checkout is the merge of the pull request into its base, the tree the
      # reports measured; the diff runs from where that merge leaves the base
      # (the base itself), so its line numbers are the reports'. The base's
      # copy of the script runs, so a pull request is measured by limits it
      # does not change; the tree's copy runs only while the base has none.
      if: >-
        ${{ github.event_name == 'pull_request' && !cancelled()
        && steps.suite.outcome != 'skipped' }}
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
      run: |
        base=$(git merge-base "$BASE_SHA" HEAD)
        out="$RUNNER_TEMP/coverage-reports/diff"
        mkdir -p "$out"
        python -I -m coverage json --fail-under=0 -o "$out/python.json"
        python -I -m gcovr --root . --fail-under-line 0 \
          --json "$out/kernel.json"
        pkg=$(python -I -c \
          'import hmmcraft, os; print(os.path.dirname(hmmcraft.__file__))')
        script=scripts/check_diff_coverage.py
        if git cat-file -e "$base:$script" 2>/dev/null; then
          git show "$base:$script" > "$RUNNER_TEMP/check_diff_coverage.py"
          script="$RUNNER_TEMP/check_diff_coverage.py"
        fi
        python -I "$script" "$base" HEAD \
          --python "$out/python.json" --map "$pkg=src/hmmcraft" \
          --kernel "$out/kernel.json"
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
      if: ${{ !cancelled() && steps.suite.outcome != 'skipped' }}
      with:
        name: coverage-reports
        path: ${{ runner.temp }}/coverage-reports/
        retention-days: 14
        if-no-files-found: warn

  sanitizers:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      HMMCRAFT_SEED: "0"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
      with:
        python-version: "3.12"
    - name: Build requirements, newest dependencies
      run: |
        python -m pip install --only-binary :all: --require-hashes \
          -r ci/build_requirements.txt
        python -m pip install --only-binary :all: \
          numpy scipy scikit-learn threadpoolctl pytest
        python -m pip freeze
        c++ --version
    - name: Build the kernel with AddressSanitizer and UBSan
      # As in the coverage job, CXXFLAGS replaces the interpreter's flags, so
      # -DNDEBUG is given again, and -g in CFLAGS keeps pybind11 from adding
      # -g0. No floating-point check is on: GCC's -fsanitize=undefined leaves
      # them out, and the kernel takes the logarithm of zero on purpose.
      env:
        CFLAGS: >-
          -fsanitize=address,undefined -fno-sanitize-recover=all
          -fno-omit-frame-pointer -O1 -g
        CXXFLAGS: >-
          -fsanitize=address,undefined -fno-sanitize-recover=all
          -fno-omit-frame-pointer -O1 -g -DNDEBUG
        LDFLAGS: -fsanitize=address,undefined
      run: |
        rm -rf build src/hmm_craft.egg-info
        python -m pip install -v --no-build-isolation --no-deps .
        for module in _hmmc _emissionsc; do
          so=$(ls build/lib.*/hmmcraft/$module.*.so)
          ldd "$so"
          ldd "$so" | grep -q libasan
          ldd "$so" | grep -q libubsan
        done
    - name: Suite under the sanitizers
      # Python is not built with the sanitizers, so their runtime is preloaded
      # for this command only: libasan first, then libstdc++, which the
      # interpreter does not load by itself and in which ASan must find
      # __cxa_throw when it starts. setarch -R turns address randomisation off
      # for this process: older ASan runtimes can crash or hang at start on
      # kernels that randomise mmap addresses with more bits. --capture=sys
      # leaves standard error to the sanitizers; under pytest's default capture
      # a report written as the process stops is lost. Leak detection is off
      # (the interpreter does not free everything at exit); abort_on_error lets
      # Python's fault handler print the test that was running.
      env:
        ASAN_OPTIONS: detect_leaks=0:abort_on_error=1
        UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1:abort_on_error=1
      run: |
        preload="$(c++ -print-file-name=libasan.so)"
        preload="$preload $(c++ -print-file-name=libstdc++.so.6)"
        setarch "$(uname -m)" -R env LD_PRELOAD="$preload" \
          python -I -m pytest -p no:cacheprovider -q --capture=sys \
          --pyargs hmmcraft.tests doc

  thread-sanitizer:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      HMMCRAFT_SEED: "0"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
      with:
        python-version: "3.12"
    - name: Build requirements, newest dependencies
      run: |
        python -m pip install --only-binary :all: --require-hashes \
          -r ci/build_requirements.txt
        python -m pip install --only-binary :all: \
          numpy scipy scikit-learn threadpoolctl pytest
        python -m pip freeze
        c++ --version
    - name: Build the kernel with ThreadSanitizer
      # As in the other jobs, CXXFLAGS replaces the interpreter's flags, so
      # -DNDEBUG is given again, and -g in CFLAGS keeps pybind11 from adding
      # -g0. Both modules are built with the flags; only _hmmc starts threads.
      env:
        CFLAGS: -fsanitize=thread -fno-omit-frame-pointer -O1 -g
        CXXFLAGS: -fsanitize=thread -fno-omit-frame-pointer -O1 -g -DNDEBUG
        LDFLAGS: -fsanitize=thread
      run: |
        rm -rf build src/hmm_craft.egg-info
        python -m pip install -v --no-build-isolation --no-deps .
        for module in _hmmc _emissionsc; do
          so=$(ls build/lib.*/hmmcraft/$module.*.so)
          ldd "$so"
          ldd "$so" | grep -q libtsan
        done
    - name: Tests of the kernel's threads under ThreadSanitizer
      # The runtime is preloaded as in the sanitizers job: libtsan, then
      # libstdc++. setarch -R, as there: older ThreadSanitizer runtimes expect
      # a fixed memory layout and stop at start when mmap addresses are
      # randomised with more bits than they know. Every test of the module
      # runs, whatever the number of cores: each sets its own thread count.
      # The module is named with --pyargs, so the installed package is
      # tested, not the source tree, which holds no built kernel; a name that
      # matches nothing fails the job (pytest exits 4 or 5).
      # ignore_noninstrumented_modules keeps the reports to code built with
      # ThreadSanitizer: the interpreter and NumPy are not.
      # second_deadlock_stack prints both stacks of a lock-order report.
      # pytest's fault handler is off: after a report, abort_on_error raises
      # SIGABRT, and the handler, once it has printed the Python stack, hangs
      # under ThreadSanitizer until the job's timeout instead of ending.
      # Without its stack, -v names the failing test: each test's name is in
      # the log before the test runs, and the report's frames stop at the
      # interpreter.
      env:
        TSAN_OPTIONS: >-
          halt_on_error=1:abort_on_error=1:second_deadlock_stack=1:ignore_noninstrumented_modules=1
      run: |
        preload="$(c++ -print-file-name=libtsan.so)"
        preload="$preload $(c++ -print-file-name=libstdc++.so.6)"
        setarch "$(uname -m)" -R env LD_PRELOAD="$preload" \
          python -I -m pytest -p no:cacheprovider -p no:faulthandler -v \
          --capture=sys --pyargs hmmcraft.tests.test_kernel_threads
