name: ci

# The suite and the bit-equality check against hmmlearn 0.3.3, in two cells:
# the declared minimums ("floor") and the newest wheels ("latest"). Wheels and
# the sdist are built and tested by wheels.yml. The weekly run shows within a
# week a new numpy, scipy or scikit-learn release that breaks the suite, or
# under which this package's fits differ from hmmlearn 0.3.3's (both are
# installed at the same versions). The types job runs pyright's basic mode
# over the package and counts its errors per file and rule against
# ci/pyright_baseline.json. The kernel-warnings job compiles the C++ kernel
# with warnings as errors with GCC, clang, Apple clang and MSVC. On a pull
# request, every commit must be signed off. A manual run also measures, on
# ARM, what the compiler option -ffp-contract=off changes (contraction-arm,
# which gates nothing).

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "47 3 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  style:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false
    - name: No Python line of 80 characters or more
      run: |
        shopt -s globstar &&
        ! grep -E '.{80}' -- **/*.py
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
      with:
        python-version: "3.12"
    - name: Install ruff from the hashed lock
      run: |
        python3 -m pip install --require-hashes --only-binary :all: \
          -r ci/lint_requirements.txt
    - name: ruff check (pyflakes and syntax errors)
      run: ruff check .
    - name: ruff format (every Python file in the formatter's style)
      run: ruff format --check .
    - name: No style finding added (ruff, per-file counts)
      run: python3 -I scripts/check_ruff_baseline.py

  types:
    name: types (pyright)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
      with:
        python-version: "3.12"
    - name: Install pyright and the package's dependencies from the hashed lock
      run: |
        python3 -m pip install --require-hashes --only-binary :all: \
          -r ci/type_requirements.txt
    - name: No type error added (pyright basic, per-file counts)
      run: python3 -I scripts/check_pyright_baseline.py

  # Both modules of the C++ kernel compiled with warnings as errors by the
  # compiler of each cell: -Wall -Wextra -Werror for GCC and clang, -W4 -WX
  # for MSVC (cl takes - or / before an option; the - form keeps Git Bash
  # from reading the value as a path). Python's and pybind11's headers are
  # system headers (-isystem; -external:anglebrackets -external:W0), so a
  # warning in them does not count; GCC and clang ignore a -I for a directory
  # also given with -isystem. setuptools puts CXXFLAGS in place of the
  # interpreter's flags on the C++ compile line and appends CPPFLAGS; cl reads
  # _CL_ after its command line, so -W4 replaces setuptools' /W3. The release
  # builds keep their flags: nothing built here is installed or uploaded, and
  # the objects go to the runner's temporary directory, not build/. Then a
  # parameter left unused is appended to ext/_emissionsc.cpp and the build
  # must fail with this cell's compiler reporting it as an error: a build that
  # passes means the flags no longer reach the compiler, and fails the job.
  # The compilers are the runner images': a new one can report a warning in an
  # unchanged tree.
  kernel-warnings:
    name: kernel warnings (${{ matrix.cell }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
        - {cell: gcc, os: ubuntu-24.04, planted: "-Werror=unused-parameter"}
        - {cell: clang, os: ubuntu-24.04, planted: "-Werror,-Wunused-parameter"}
        - {cell: apple-clang, os: macos-15, planted: "-Werror,-Wunused-parameter"}
        - {cell: msvc, os: windows-2025, planted: "C4100: 'planted'"}
    defaults:
      run:
        shell: bash
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
      with:
        python-version: "3.12"
    - name: Build requirements from the hashed lock
      run: |
        python -m pip install --only-binary :all: --require-hashes \
          -r ci/build_requirements.txt
        python -m pip freeze
    - name: Compiler and flags of the cell
      env:
        CELL: ${{ matrix.cell }}
      run: |
        if [ "$CELL" = msvc ]; then
          echo "_CL_=-W4 -WX -external:anglebrackets -external:W0" >> "$GITHUB_ENV"
          exit 0
        fi
        if [ "$CELL" = clang ]; then
          printf 'CC=clang\nCXX=clang++\n' >> "$GITHUB_ENV"
          cxx=clang++
        else
          cxx=$(python -c 'import sysconfig; print(sysconfig.get_config_var("CXX"))')
        fi
        $cxx --version
        pybind11=$(python -c 'import pybind11; print(pybind11.get_include())')
        include=$(python -c 'import sysconfig; print(sysconfig.get_config_var("INCLUDEPY"))')
        echo "CPPFLAGS=-isystem $pybind11 -isystem $include" >> "$GITHUB_ENV"
        echo "CXXFLAGS=-O2 -DNDEBUG -Wall -Wextra -Werror" >> "$GITHUB_ENV"
    - name: Both modules build with warnings as errors
      run: |
        python -c "import os; print(repr(os.environ.get('_CL_')))"
        python setup.py build_ext -v --build-temp "$RUNNER_TEMP/kernel/temp" \
          --build-lib "$RUNNER_TEMP/kernel/lib"
    - name: A planted warning fails the build
      env:
        PLANTED: ${{ matrix.planted }}
      run: |
        printf '\nvoid planted_warning(int planted) {}\n' >> ext/_emissionsc.cpp
        if python setup.py build_ext -v --build-temp "$RUNNER_TEMP/kernel/temp" \
            --build-lib "$RUNNER_TEMP/kernel/lib" > "$RUNNER_TEMP/planted.log" 2>&1
        then
          cat "$RUNNER_TEMP/planted.log"
          echo "::error::the planted warning did not fail the build"
          exit 1
        fi
        cat "$RUNNER_TEMP/planted.log"
        grep -F planted "$RUNNER_TEMP/planted.log" | grep -F -- "$PLANTED"

  sign-off:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: Every commit signed off (DCO)
      env:
        BASE: ${{ github.event.pull_request.base.sha }}
        HEAD: ${{ github.event.pull_request.head.sha }}
      # The base branch's copy of the script, so a pull request that edits
      # the script is checked by the copy it does not change.
      run: |
        git show "$BASE:scripts/check_signoff.py" > "$RUNNER_TEMP/check_signoff.py"
        python3 -I "$RUNNER_TEMP/check_signoff.py" "$BASE" "$HEAD"

  bit-equality:
    name: bit equality (${{ matrix.cell }})
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        cell: [floor, latest]
    env:
      HMMCRAFT_SEED: "0"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
      with:
        python-version: "3.12"
    - name: Suite and bit equality against hmmlearn 0.3.3
      run: scripts/ci_bit_equality.sh "${{ matrix.cell }}" "$RUNNER_TEMP/check"

  # Manual runs only: a measurement, never a gate. On Linux aarch64 and macOS
  # arm64, scripts/measure_contraction.sh builds hmmlearn 0.3.3 as its
  # setup.py builds it (REF), the same with -ffp-contract=off (REF_OFF) and
  # this package (FORK), with the runner's compiler, and compares their
  # results: REF with REF_OFF, then each with FORK. It also reports whether
  # the kernels of the published wheels of hmmlearn 0.3.3 and of this
  # package 0.4.1, as pip installs them here, fuse a product into a sum. No
  # step of the script stops it, and a comparison that finds differences is
  # a result: a cell is red only when a step gave none. The
  # run's summary shows each cell's summary.txt, which says how to read it;
  # the build logs, the dumps and every output are in the artifact
  # "contraction-<os>-<cell>". The floor cell is best effort: its failure
  # does not fail the run.
  contraction-arm:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    continue-on-error: ${{ matrix.cell == 'floor' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04-arm, macos-15]
        cell: [latest, floor]
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
      with:
        python-version: "3.12"
    - name: Three builds, four dumps, three comparisons, the probes
      if: ${{ !cancelled() }}
      run: >-
        sh scripts/measure_contraction.sh "${{ matrix.cell }}"
        "$RUNNER_TEMP/contraction"
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
      if: ${{ !cancelled() }}
      with:
        name: contraction-${{ matrix.os }}-${{ matrix.cell }}
        path: ${{ runner.temp }}/contraction/out/
        retention-days: 14
        if-no-files-found: warn
