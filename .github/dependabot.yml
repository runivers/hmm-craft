# Proposes newer releases of the pinned GitHub Actions once a month, in one
# pull request. Build requirements (ci/*.txt) are updated by hand.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: chore
    labels: []
