# Proposes newer releases of the pinned GitHub Actions once a month, in one
# pull request. The hashed build requirements under ci/ are updated by hand;
# the weekly pins.yml names a stale one.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: chore
    labels: []
