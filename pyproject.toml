[build-system]
requires = [
    "setuptools>=77",
    "setuptools_scm[toml]>=6.2",
    "pybind11>=3.0",
]
build-backend = "setuptools.build_meta"

[project]
name = "hmm-craft"
description = "A fork of hmmlearn: hidden Markov models with a scikit-learn like API"
readme = "README.rst"
license = "BSD-3-Clause"
license-files = ["LICENSE.txt", "AUTHORS.rst"]
authors = [
    {name = "David Cournapeau"},  # 2007-2009
    {name = "Fabian Pedregosa"},  # 2010
    {name = "Gael Varoquaux"},  # 2014
    {name = "Sergei Lebedev"},  # 2014-2016
    {name = "Antony Lee"},  # 2018-2023
    {name = "Matthew Danielson"},  # 2023
    {name = "hmm-craft authors and contributors"},  # 2026-
]
maintainers = [
    {name = "rudolfmleziva"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Software Development",
    "Topic :: Scientific/Engineering",
    "Programming Language :: C++",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: Implementation :: CPython",
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26.0",  # oldest numpy with a CPython 3.12 wheel.
    "scikit-learn>=1.3.1",  # oldest scikit-learn with a CPython 3.12 wheel.
    "scipy>=1.11.2",  # oldest scipy with a CPython 3.12 wheel.
    "threadpoolctl>=3.5.0",  # oldest that limits numpy 2.5.4's OpenBLAS.
]
dynamic = ["version"]

[project.urls]
Repository = "https://github.com/runivers/hmm-craft"
Issues = "https://github.com/runivers/hmm-craft/issues"
Changelog = "https://github.com/runivers/hmm-craft/blob/main/CHANGES.rst"
Upstream = "https://github.com/hmmlearn/hmmlearn"

[project.optional-dependencies]
tests = [
    "pytest",
]
docs = [
    "matplotlib",
    "pydata_sphinx_theme",
    "sphinx>=2.0",
    "sphinx-gallery",
]

[tool.setuptools_scm]
version_scheme = "post-release"
local_scheme = "node-and-date"
fallback_version = "0+unknown"

[tool.ruff]
line-length = 79

[tool.ruff.lint]
# ruff's classic set (syntax errors and pyflakes), D1, which asks for a
# docstring on every public module, class, function and method, and the
# bugbear (B), numpy (NPY) and performance (PERF) rules. CI runs
# `ruff check .` with it, and scripts/check_ruff_baseline.py counts the wider
# findings.
select = ["E4", "E7", "E9", "F", "D1", "B", "NPY", "PERF"]
# numpydoc documents __init__ in the class docstring.
ignore = ["D107"]

[tool.ruff.lint.per-file-ignores]
# Test functions are named for what they check. The tests seed and read
# numpy's global generator; another generator would draw other data.
"src/hmmcraft/tests/**" = ["D1", "NPY002"]
# GMMHMM's start draws from numpy's global generator, as hmmlearn 0.3.3's
# does, so that its fits equal 0.3.3's, until the start uses a Generator.
"src/hmmcraft/hmm.py" = ["NPY002"]
# Command-line tools, documented by their usage text, and their tests.
"scripts/**" = ["D1"]
# The bit-equality check seeds numpy's global generator before each model,
# since GMMHMM's start draws from it, and records its state; its tests check
# that state.
"scripts/bit_equality.py" = ["NPY002"]
"scripts/test_bit_equality.py" = ["NPY002"]
# The Sphinx configuration.
"doc/**" = ["D1"]
# Gallery scripts, documented by their header; their helpers are local.
"examples/**" = ["D1"]
# The casino example draws its starting transitions from numpy's global
# generator; another generator would draw other ones.
"examples/plot_casino.py" = ["NPY002"]
# The build hook.
"setup.py" = ["D1"]

[tool.coverage.run]
branch = true
source_pkgs = ["hmmcraft"]
omit = ["*/hmmcraft/tests/*"]

[tool.coverage.report]
# Raised by hand, never lowered without a reason (RELEASING.md).
fail_under = 92
precision = 2

[tool.gcovr]
filter = ["ext/"]
exclude-throw-branches = true
exclude-unreachable-branches = true
# A string: gcovr 8.8 reads a percentage as text.
fail-under-line = "96"

[tool.pytest.ini_options]
addopts = "--doctest-glob=*.rst"
filterwarnings = [
    "error",
    "ignore::DeprecationWarning",
    "error::DeprecationWarning:hmmcraft",
    "ignore:underflow",
]
